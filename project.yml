name: HealthCheckup
options:
  bundleIdPrefix: local.healthcheckup
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ko
packages:
  HealthCore:
    path: Packages/HealthCore
  # 앱 안 자동 업데이트
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  HealthCheckup:
    type: application
    platform: macOS
    sources:
      - HealthCheckup
    dependencies:
      - package: HealthCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: 건강하면됐지
        PRODUCT_MODULE_NAME: HealthCheckup
        # SwiftData는 이전 기록 옮기기에만 씀 (macOS 13에는 없으므로 약하게 연결)
        OTHER_LDFLAGS: ["-weak_framework", "SwiftData"]
        # 실행 파일 이름은 영문 (한글이면 서명 단계에서 실패)
        EXECUTABLE_NAME: HealthCheckup
        PRODUCT_BUNDLE_IDENTIFIER: local.healthcheckup.app
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle 설정(업데이트 주소·공개 열쇠)은 이 파일에, 나머지는 자동 생성과 합쳐짐
        INFOPLIST_FILE: HealthCheckup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 건강하면됐지
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 healthOK. All rights reserved."
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
        # Xcode에서는 ad-hoc 서명, 배포용 서명·공증은 scripts/build_app.sh가 함
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  HealthCheckup:
    build:
      targets:
        HealthCheckup: all
    test:
      targets:
        - package: HealthCore/HealthCoreTests
