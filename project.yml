name: HealthCheckup
options:
  bundleIdPrefix: local.healthcheckup
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ko
packages:
  HealthCore:
    path: Packages/HealthCore
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  HealthCheckup:
    type: application
    platform: macOS
    sources:
      - HealthCheckup
    dependencies:
      - package: HealthCore
    settings:
      base:
        PRODUCT_NAME: 건강하면됐지
        PRODUCT_MODULE_NAME: HealthCheckup
        # SwiftData는 이전 기록 옮기기에만 씀 (macOS 13에는 없으므로 약하게 연결)
        OTHER_LDFLAGS: ["-weak_framework", "SwiftData"]
        # 실행 파일 이름은 영문 (한글이면 서명 단계에서 실패)
        EXECUTABLE_NAME: HealthCheckup
        PRODUCT_BUNDLE_IDENTIFIER: local.healthcheckup.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 건강하면됐지
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 healthOK. All rights reserved."
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
        # 가족 맥에 나눠 줄 수 있도록 개발자 계정 없이 ad-hoc 서명
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  HealthCheckup:
    build:
      targets:
        HealthCheckup: all
    test:
      targets:
        - package: HealthCore/HealthCoreTests
